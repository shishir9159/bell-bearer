<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bell Bearer — injected UI preview</title>
    <link rel="stylesheet" href="../skin-fonts.css">
    <link rel="stylesheet" href="../content.css">
    <style>
        /* Stand-in for the page underneath. Not part of the extension. */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Roboto', -apple-system, 'Segoe UI', Arial, sans-serif;
            background: #f9f9f9;
            color: #0f0f0f;
        }
        body.yt-dark {
            background: #0f0f0f; color: #f1f1f1;
            --yt-spec-text-primary: #f1f1f1;
            --yt-spec-10-percent-layer: rgba(255, 255, 255, .1);
        }
        .yt-bar {
            display: flex; align-items: center; gap: 16px;
            height: 56px; padding: 0 16px;
            border-bottom: 1px solid rgba(0, 0, 0, .1);
        }
        body.yt-dark .yt-bar { border-color: rgba(255, 255, 255, .12); }
        .yt-logo { font-weight: 700; font-size: 19px; letter-spacing: -.5px; }
        .yt-search {
            flex: 1; max-width: 480px; height: 34px;
            border: 1px solid rgba(0, 0, 0, .16); border-radius: 999px;
            display: flex; align-items: center; padding: 0 14px;
            font-size: 13px; color: #909090;
        }
        body.yt-dark .yt-search { border-color: rgba(255, 255, 255, .2); }
        .yt-body { display: flex; }
        .yt-guide { width: 220px; padding: 10px 0; flex-shrink: 0; }
        .yt-guide-item {
            display: flex; align-items: center; gap: 24px;
            height: 40px; margin: 0 12px; padding: 0 12px;
            border-radius: 10px; font-size: 14px;
        }
        .yt-dot { width: 22px; height: 22px; border-radius: 6px; background: rgba(0, 0, 0, .12); }
        body.yt-dark .yt-dot { background: rgba(255, 255, 255, .14); }
        .yt-grid {
            flex: 1; padding: 20px 24px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px 16px;
        }
        .yt-thumb { aspect-ratio: 16/9; border-radius: 12px; background: rgba(0, 0, 0, .1); }
        body.yt-dark .yt-thumb { background: rgba(255, 255, 255, .09); }
        .yt-line { height: 9px; border-radius: 4px; background: rgba(0, 0, 0, .12); margin-top: 10px; }
        .yt-line.short { width: 55%; }
        body.yt-dark .yt-line { background: rgba(255, 255, 255, .12); }
        .toolbar {
            position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
            display: flex; gap: 6px; z-index: 2147483647;
            background: #16110f; padding: 6px; border-radius: 999px;
            box-shadow: 0 8px 26px rgba(0, 0, 0, .3);
        }
        .toolbar button {
            border: none; background: transparent; color: #cfc6c4;
            font: 600 12px/1 'Roboto', sans-serif; padding: 7px 13px;
            border-radius: 999px; cursor: pointer;
        }
        .toolbar button.on { background: #b81808; color: #fff; }
    </style>
</head>

<body>
    <div class="yt-bar">
        <div class="yt-logo">Video site</div>
        <div class="yt-search">Search</div>
    </div>
    <div class="yt-body">
        <nav class="yt-guide">
            <div class="yt-guide-item"><span class="yt-dot"></span>Home</div>
            <div class="yt-guide-item"><span class="yt-dot"></span>Subscriptions</div>
            <div class="bb-guide-entry">
                <span class="bb-guide-ico">◆</span>
                <span class="bb-guide-text">Bell Bearer</span>
            </div>
            <div class="yt-guide-item"><span class="yt-dot"></span>History</div>
        </nav>
        <div class="yt-grid">
            <div><div class="yt-thumb"></div><div class="yt-line"></div><div class="yt-line short"></div></div>
            <div><div class="yt-thumb"></div><div class="yt-line"></div><div class="yt-line short"></div></div>
            <div><div class="yt-thumb"></div><div class="yt-line"></div><div class="yt-line short"></div></div>
            <div><div class="yt-thumb"></div><div class="yt-line"></div><div class="yt-line short"></div></div>
            <div><div class="yt-thumb"></div><div class="yt-line"></div><div class="yt-line short"></div></div>
            <div><div class="yt-thumb"></div><div class="yt-line"></div><div class="yt-line short"></div></div>
        </div>
    </div>

    <!-- ---------------------------------------------- topics overlay -->
    <div class="bb-modal-overlay bb-sheet-overlay bb-themed" id="sheet">
        <div class="bb-sheet">
            <div class="bb-sheet-head">
                <div class="bb-sheet-brand">
                    <img src="../icons/icon128.png" alt="">
                    <span class="bb-sheet-title">Pouch</span>
                    <span class="bb-sheet-sub">124 videos · 6 topics</span>
                </div>
                <div class="bb-sheet-tools">
                    <div class="bb-seg" role="group" aria-label="Time range">
                        <button class="bb-seg-opt" aria-pressed="false">7d</button>
                        <button class="bb-seg-opt" aria-pressed="true">30d</button>
                        <button class="bb-seg-opt" aria-pressed="false">90d</button>
                        <button class="bb-seg-opt" aria-pressed="false">All</button>
                    </div>
                    <select class="bb-select" aria-label="Sort">
                        <option>Newest</option>
                        <option>Oldest</option>
                        <option>Channel</option>
                    </select>
                    <button class="bb-close" aria-label="Close">×</button>
                </div>
            </div>
            <div class="bb-sheet-body">
                <nav class="bb-topics">
                    <div class="bb-topics-label">Topics</div>
                    <button class="bb-topic" aria-current="true"><span class="bb-topic-name">All</span><span class="bb-topic-n">124</span></button>
                    <button class="bb-topic"><span class="bb-topic-name">Printing &amp; type</span><span class="bb-topic-n">28</span></button>
                    <button class="bb-topic"><span class="bb-topic-name">Bell ringing</span><span class="bb-topic-n">19</span></button>
                    <button class="bb-topic"><span class="bb-topic-name">Manuscripts</span><span class="bb-topic-n">31</span></button>
                    <button class="bb-topic"><span class="bb-topic-name">Field recording</span><span class="bb-topic-n">12</span></button>
                    <button class="bb-topic"><span class="bb-topic-name">Woodworking</span><span class="bb-topic-n">22</span></button>
                    <button class="bb-topic"><span class="bb-topic-name">Unsorted</span><span class="bb-topic-n">12</span></button>
                    <button class="bb-topic-add">+ New topic</button>
                </nav>
                <div class="bb-videos">
                    <div class="bb-video-grid" id="grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ---------------------------------------------- pouch modal -->
    <div class="bb-modal-overlay bb-themed" id="pouch" style="display:none">
        <div class="bb-panel bb-panel-sm">
            <div class="bb-panel-head">
                <h3>Add to pouch</h3>
                <button class="bb-close" aria-label="Close">×</button>
            </div>
            <div class="bb-pouch-channel">
                <div class="bb-pouch-avatar"></div>
                <div style="min-width:0">
                    <div class="bb-pouch-name">Ink &amp; Drum</div>
                    <div class="bb-pouch-sub">148K subscribers · not yet in a topic</div>
                </div>
            </div>
            <div class="bb-panel-body">
                <span class="bb-field-label">Topic</span>
                <div class="bb-chips">
                    <button class="bb-topic-chip" aria-pressed="false">Printing &amp; type</button>
                    <button class="bb-topic-chip" aria-pressed="true">Bell ringing</button>
                    <button class="bb-topic-chip" aria-pressed="false">Manuscripts</button>
                    <button class="bb-topic-chip" aria-pressed="false">Field recording</button>
                    <button class="bb-topic-chip" aria-pressed="false">Woodworking</button>
                </div>
                <span class="bb-field-label">Or start a new one</span>
                <div class="bb-new-topic">
                    <input class="bb-input" placeholder="Topic name">
                    <button class="bb-btn">Create</button>
                </div>
                <div class="bb-actions">
                    <button class="bb-btn">Cancel</button>
                    <button class="bb-btn bb-btn-primary">Save channel</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toolbar">
        <button id="tSheet" class="on">Topics overlay</button>
        <button id="tPouch">Pouch modal</button>
        <button id="tTheme">Dark</button>
    </div>

    <script>
        const titles = [
            ['Risograph duplicators, explained end to end', 'Ink & Drum', '2 days ago'],
            ['How medieval scribes ruled a page before printing', 'Codex', '4 days ago'],
            ['Art deco lettering: the geometry underneath', 'Type Foundry', '6 days ago'],
            ['A full peal from the tower, uncut', 'Ashen Vale', '1 week ago'],
            ['Mixing fluorescent pink with process blue', 'Ink & Drum', '1 week ago'],
            ['Gilding a capital with shell gold', 'Codex', '2 weeks ago'],
            ['Field recording a carillon at dawn', 'Ashen Vale', '2 weeks ago'],
            ['Setting a chevron border in metal type', 'Type Foundry', '3 weeks ago'],
        ];
        document.getElementById('grid').innerHTML = titles.map(([t, c, a]) => `
            <a class="bb-video-card" href="#">
                <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 180'%3E%3Crect width='320' height='180' fill='%23b9b4b0'/%3E%3Cpath d='M132 62l64 28-64 28z' fill='%23ffffff' opacity='.55'/%3E%3C/svg%3E" alt="">
                <div class="bb-video-meta">
                    <div class="bb-video-title">${t}</div>
                    <div class="bb-video-channel"><span>${c}</span><span class="bb-video-age">${a}</span></div>
                </div>
            </a>`).join('');

        const q = new URLSearchParams(location.search);
        const sheet = document.getElementById('sheet');
        const pouch = document.getElementById('pouch');

        function setTheme(dark) {
            document.body.classList.toggle('yt-dark', dark);
            [sheet, pouch].forEach((el) => el.dataset.bbTheme = dark ? 'dark' : 'light');
            document.getElementById('tTheme').textContent = dark ? 'Light' : 'Dark';
        }
        function setSkin(skin) {
            [sheet, pouch].forEach((el) => el.dataset.bbSkin = skin || 'default');
        }
        function show(which) {
            sheet.style.display = which === 'sheet' ? '' : 'none';
            pouch.style.display = which === 'pouch' ? '' : 'none';
            document.getElementById('tSheet').classList.toggle('on', which === 'sheet');
            document.getElementById('tPouch').classList.toggle('on', which === 'pouch');
        }

        setSkin(q.get('skin') || 'default');
        setTheme(q.get('theme') === 'dark');
        show(q.get('view') === 'pouch' ? 'pouch' : 'sheet');

        document.getElementById('tSheet').onclick = () => show('sheet');
        document.getElementById('tPouch').onclick = () => show('pouch');
        document.getElementById('tTheme').onclick = () => setTheme(!document.body.classList.contains('yt-dark'));

        document.querySelectorAll('.bb-topic').forEach((topic) => {
            topic.onclick = () => {
                document.querySelectorAll('.bb-topic').forEach((t) => t.setAttribute('aria-current', 'false'));
                topic.setAttribute('aria-current', 'true');
            };
        });
        document.querySelectorAll('.bb-seg-opt').forEach((opt) => {
            opt.onclick = () => {
                document.querySelectorAll('.bb-seg-opt').forEach((o) => o.setAttribute('aria-pressed', 'false'));
                opt.setAttribute('aria-pressed', 'true');
            };
        });
        document.querySelectorAll('.bb-topic-chip').forEach((chip) => {
            chip.onclick = () => {
                document.querySelectorAll('.bb-topic-chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));
                chip.setAttribute('aria-pressed', 'true');
            };
        });
    </script>
</body>

</html>
