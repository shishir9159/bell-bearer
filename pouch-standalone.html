<!DOCTYPE html>
<!--
  ============================================================================
  POUCH — standalone build (Bell Bearer extension, x.com module)

  Self-contained: skins, textures and runtime are inlined. Open it in a
  browser, no server needed. This is the DESIGN SPEC, not shippable extension
  code — it renders both surfaces of the feature so behaviour is unambiguous.

  WHAT IS IN HERE
    "X page" tab      the content-script UI: the Pouch nav item, the overlay
                      panel, the bag button replacing X's bookmark, and the
                      add-to-pouch button on a profile header.
    "Dashboard" tab   the dashboard's X view: site card, People/Posts tabs,
                      topic cards with drag-reorder, pen-to-rename,
                      trash-to-delete (confirmed), click-to-edit notes,
                      cross-to-remove rows, and the four-skin switcher.

  RULES THE DESIGN ENCODES
    - People topics and post topics are two independent lists.
    - An item belongs to exactly one topic; re-filing moves it silently.
    - Topics are created, renamed, reordered and deleted in the dashboard
      only (the post picker may create a topic; nothing else).
    - Un-saving a post happens in the dashboard only.
    - Notes (3-5 words) are written in the dashboard; the panel displays them.
    - The overlay never covers the timeline; it sits over X's nav column on a
      scrim, and any click outside it dismisses it.

  INTEGRATING (for Claude Code)
    1. Skins: take the token blocks from bb-skins.css. They are keyed on
       [data-skin] / [data-dark] rather than <body> so two skinned roots can
       coexist on one page. Merge into the extension's skins.css, or ship the
       file as is and set the attributes on the Pouch root.
    2. Storage (chrome.storage.local), shape used throughout:
         peopleTopics [] {id, name}                  array order = display order
         postTopics   [] {id, name}                  independent list
         people       [] {id, topic, name, handle, note}
         saved        [] {id, topic, handle, when, text}
    3. Content script: mount one root into x.com, mirror the stored skin onto
       its data-skin, and mirror X's own light/dark onto data-dark. Keep every
       element of yours inside a [data-keep-panel] subtree — the outside-click
       dismissal keys off that attribute.
    4. Dashboard: the X view follows the existing site-view pattern
       (renderSubscriptions / topic-card), so the same delegated-listener
       approach applies; re-render wholesale and bind once on the container.
    5. Textures are inlined here as data URIs. In the extension keep the three
       PNGs in the extension folder and resolve with chrome.runtime.getURL().

  The sample people, posts and topics are fixtures. Replace with real storage.
  ============================================================================
-->

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ing: rgba(184, 24, 8, .30);\n  --on-accent: #ffffff;\n  --accent-ink: #a41406;\n  --gold: var(--accent);\n\n  --bg: #f2efee;\n  --surface: #ffffff;\n  --surface-2: #f7f5f4;\n  --surface-3: #efebea;\n  --header-bg: #ffffff;\n  --header-text: #191515;\n\n  --text: #191515;\n  --text-muted: #5c5252;\n  --text-faint: #8f8585;\n\n  --border: #e7e3e3;\n  --border-strong: #d6d0cf;\n  --danger: #c1170a;\n\n  --r-sm: 8px;\n  --r: 12px;\n  --r-pill: 999px;\n  --card-radius: 12px;\n  --btn-radius: 999px;\n\n  --shadow-sm: 0 1px 2px rgba(30, 16, 12, .05), 0 2px 6px rgba(30, 16, 12, .06);\n  --shadow-md: 0 6px 18px rgba(30, 16, 12, .10), 0 2px 6px rgba(30, 16, 12, .06);\n  --shadow-lg: 0 22px 52px rgba(30, 16, 12, .22);\n  --card-border-width: 1px;\n\n  --kbd-bg: #000000;\n  --kbd-key-bg: #fffff4;\n  --kbd-key-color: #000000;\n  --kbd-sub-color: #6b6b63;\n  --kbd-active-bg: #fceeb5;\n  --kbd-active-color: #4a3a06;\n  --kbd-radius: 5px;\n  --kbd-board-radius: 10px;\n\n  --site-tint-1: #fbe3de;\n  --site-tint-2: #e3efdc;\n  --site-tint-3: #e1e6f3;\n  --site-tint-4: #f4ead6;\n\n  --tex: none;\n  --tex-size: auto;\n  --tex-blend: normal;\n  --tex-opacity: 0;\n}\n\n/* 1b. DEFAULT — night */\n[data-skin=\"default\"][data-dark] {\n  color-scheme: dark;\n  --accent: #7289da;\n  --accent-2: #8a9bf0;\n  --accent-hover: #8a9bf0;\n  --accent-soft: rgba(114, 137, 218, .16);\n  --accent-soft-2: rgba(114, 137, 218, .26);\n  --accent-ring: rgba(114, 137, 218, .45);\n  --on-accent: #ffffff;\n  --accent-ink: #9fb0f5;\n\n  --bg: #202225;\n  --surface: #2f3136;\n  --surface-2: #36393f;\n  --surface-3: #40444b;\n  --header-bg: #2f3136;\n  --header-text: #ffffff;\n\n  --text: #e3e5e8;\n  --text-muted: #b5bac1;\n  --text-faint: #80848e;\n\n  --border: #26282c;\n  --border-strong: #40444b;\n  --danger: #f0626c;\n\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35), 0 2px 8px rgba(0, 0, 0, .35);\n  --shadow-md: 0 8px 22px rgba(0, 0, 0, .50);\n  --shadow-lg: 0 24px 56px rgba(0, 0, 0, .65);\n\n  --site-tint-1: #4a3437;\n  --site-tint-2: #2f4136;\n  --site-tint-3: #383e5e;\n  --site-tint-4: #483f2e;\n}\n\n/* ---------------------------------------------- 2. RISO — day */\n[data-skin=\"riso\"] {\n  color-scheme: light;\n  --font: 'Space Grotesk', 'Helvetica Neue', Helvetica, sans-serif;\n  --font-head: 'Space Grotesk', 'Helvetica Neue', Helvetica, sans-serif;\n  --font-display: 'Space Grotesk', Helvetica, sans-serif;\n  --head-case: uppercase;\n  --head-track: .06em;\n  --head-weight: 700;\n\n  --ink-pink: #ff48b0;\n  --ink-blue: #1f5fd0;\n  --ink-yellow: #ffc60b;\n\n  --accent: #ff48b0;\n  --accent-2: #1f5fd0;\n  --accent-hover: #e8309a;\n  --accent-soft: rgba(255, 72, 176, .12);\n  --accent-soft-2: rgba(255, 72, 176, .24);\n  --accent-ring: rgba(31, 95, 208, .40);\n  --on-accent: #fffdf6;\n  --accent-ink: #d1157f;\n  --gold: #ffc60b;\n\n  --bg: #efece0;\n  --surface: #f7f4e9;\n  --surface-2: #ece8da;\n  --surface-3: #e2ddcb;\n  --header-bg: #1f5fd0;\n  --header-text: #fffdf6;\n\n  --text: #17161a;\n  --text-muted: #4c4a52;\n  --text-faint: #86828c;\n\n  --border: #17161a;\n  --border-strong: #17161a;\n  --danger: #d1157f;\n\n  --r-sm: 0px;\n  --r: 0px;\n  --r-pill: 0px;\n  --card-radius: 0px;\n  --btn-radius: 0px;\n\n  --shadow-sm: 3px 3px 0 var(--ink-blue);\n  --shadow-md: 5px 5px 0 var(--ink-blue);\n  --shadow-lg: 10px 10px 0 var(--ink-pink);\n  --card-border-width: 1.5px;\n\n  --kbd-bg: #17161a;\n  --kbd-key-bg: #f7f4e9;\n  --kbd-key-color: #17161a;\n  --kbd-sub-color: #86828c;\n  --kbd-active-bg: #ffc60b;\n  --kbd-active-color: #17161a;\n  --kbd-radius: 0px;\n  --kbd-board-radius: 0px;\n\n  --site-tint-1: #ffd1ea;\n  --site-tint-2: #ffecaa;\n  --site-tint-3: #cfdcf5;\n  --site-tint-4: #e2ddcb;\n\n  --tex: url(\"3b631128-5dde-407d-a513-2ee8def9b0f3\");\n  --tex-size: 120px 120px;\n  --tex-blend: multiply;\n  --tex-opacity: .55;\n}\n\n/* 2b. RISO — night: same inks, black stock */\n[data-skin=\"riso\"][data-dark] {\n  color-scheme: dark;\n  --bg: #121115;\n  --surface: # : #ecdcb8;\n  --kbd-key-color: #3b2a17;\n  --kbd-sub-color: #8d7757;\n  --kbd-active-bg: #d8ac52;\n  --kbd-active-color: #2b2016;\n  --kbd-radius: 3px;\n  --kbd-board-radius: 3px;\n\n  --site-tint-1: #e5c2a8;\n  --site-tint-2: #d6d3a2;\n  --site-tint-3: #e8d08f;\n  --site-tint-4: #d8c69c;\n\n  --tex: url(\"e9791e06-3051-451a-88c7-a56a382b6aef\");\n  --tex-size: 160px 160px;\n  --tex-blend: multiply;\n  --tex-opacity: .9;\n}\n\n/* 3b. MEDIEVAL — night: the same page by candlelight */\n[data-skin=\"medieval\"][data-dark] {\n  color-scheme: dark;\n  --accent: #c4482c;\n  --accent-2: #d8ac52;\n  --accent-hover: #d95c3d;\n  --accent-soft: rgba(196, 72, 44, .16);\n  --accent-soft-2: rgba(196, 72, 44, .28);\n  --on-accent: #1c1409;\n  --accent-ink: #e0805c;\n  --gold: #d8ac52;\n\n  --bg: #1b140c;\n  --surface: #241c12;\n  --surface-2: #2c2216;\n  --surface-3: #372b1c;\n  --header-bg: #120d07;\n  --header-text: #e8d5a3;\n\n  --text: #e8d5a3;\n  --text-muted: #bda67a;\n  --text-faint: #8d7a56;\n\n  --border: #443320;\n  --border-strong: #57422a;\n  --danger: #d8663f;\n\n  --shadow-sm: 0 1px 3px rgba(0, 0, 0, .55);\n  --shadow-md: 0 8px 22px rgba(0, 0, 0, .60);\n  --shadow-lg: 0 24px 56px rgba(0, 0, 0, .75);\n\n  --tex-blend: overlay;\n  --tex-opacity: .28;\n\n  --site-tint-1: #3b2216;\n  --site-tint-2: #2c2e1b;\n  --site-tint-3: #3b2e14;\n  --site-tint-4: #372b1c;\n}\n\n/* ---------------------------------------------- 4. ART DECO — day */\n[data-skin=\"deco\"] {\n  color-scheme: light;\n  --font: 'Josefin Sans', 'Century Gothic', 'Avenir Next', sans-serif;\n  --font-head: 'Poiret One', 'Josefin Sans', sans-serif;\n  --font-display: 'Poiret One', 'Josefin Sans', sans-serif;\n  --head-case: uppercase;\n  --head-track: .18em;\n  --head-weight: 400;\n\n  --gold: #b99447;\n  --gold-2: #e0c274;\n  --jade: #1f6e5c;\n\n  --accent: #a67c2e;\n  --accent-2: #b99447;\n  --accent-hover: #8c6621;\n  --accent-soft: rgba(185, 148, 71, .12);\n  --accent-soft-2: rgba(185, 148, 71, .26);\n  --accent-ring: rgba(185, 148, 71, .45);\n  --on-accent: #f7f3e8;\n  --accent-ink: #7d5a1b;\n\n  --bg: #ece7db;\n  --surface: #f7f3e8;\n  --surface-2: #f0ebdd;\n  --surface-3: #e5dfcd;\n  --header-bg: #14110d;\n  --header-text: #e8dcbb;\n\n  --text: #14110d;\n  --text-muted: #5a5142;\n  --text-faint: #8e836f;\n\n  --border: #d5cdb6;\n  --border-strong: #14110d;\n  --danger: #8e2f24;\n\n  --r-sm: 0px;\n  --r: 0px;\n  --r-pill: 0px;\n  --card-radius: 0px;\n  --btn-radius: 0px;\n\n  --shadow-sm: 0 1px 2px rgba(20, 17, 13, .08);\n  --shadow-md: 0 8px 24px rgba(20, 17, 13, .14);\n  --shadow-lg: 0 24px 60px rgba(20, 17, 13, .30);\n  --card-border-width: 1px;\n\n  --kbd-bg: #14110d;\n  --kbd-key-bg: #f7f3e8;\n  --kbd-key-color: #14110d;\n  --kbd-sub-color: #8e836f;\n  --kbd-active-bg: #e0c274;\n  --kbd-active-color: #14110d;\n  --kbd-radius: 0px;\n  --kbd-board-radius: 0px;\n\n  --site-tint-1: #efe0bb;\n  --site-tint-2: #d3e6dd;\n  --site-tint-3: #e9d7cf;\n  --site-tint-4: #e5dfcd;\n\n  --tex: url(\"3b46260d-eb4d-48ef-b9e4-f6c270d4c7e8\");\n  --tex-size: 140px 140px;\n  --tex-blend: multiply;\n  --tex-opacity: .3;\n}\n\n/* 4b. ART DECO — night: gilt on lacquer */\n[data-skin=\"deco\"][data-dark] {\n  color-scheme: dark;\n  --accent: #c9a227;\n  --accent-2: #e0c274;\n  --accent-hover: #e0c274;\n  --accent-soft: rgba(201, 162, 39, .14);\n  --accent-soft-2: rgba(201, 162, 39, .28);\n  --on-accent: #0e0d0c;\n  --accent-ink: #dcbc55;\n  --gold: #e0c274;\n\n  --bg: #0e0d0c;\n  --surface: #161513;\n  --surface-2: #1d1b18;\n  --surface-3: #262320;\n  --header-bg: #0a0908;\n  --header-text: #dcbc55;\n\n  --text: #efe7d4;\n  --text-muted: #b3a88d;\n  --text-faint: #7e755f;\n\n  --border: #332f28;\n  --border-strong: #c9a227;\n  --danger: #c2564a;\n\n  --shadow-sm: 0 1px 3px rgba(0, 0, 0, .55);\n  --shadow-md: 0 8px 24px rgba(0, 0, 0, .60);\n  --shadow-lg: 0 24px 60px rgba(0, 0, 0, .75);\n\n  --tex-blend: overlay;\n  --tex-opacity: .3;\n\n  --site-tint-1: #2b2412;\n  --site-tint-2: #12251e;\n  --site-tint-3: #2a1916;\n  --site-tint-4: #262320;\n}\n\n/* ============================================================\n   Ornament layer — the parts of a skin that are not colour.\n   ============================================================ */\n\n.bb-head {\n  font-family: var(--font-head);\n  font-weight: var(--head-weight);\n  text-transform: var(--head-case);\n  letter-spacing: var(--head-track);\n}\n\n.bb-wordmark {\n  font-family: var(--font-display);\n  letter-spacing: var(--head-track);\n}\n\n[data-skin=\"deco\"] .bb-wordmark { text-transform: uppercase; letter-spacing: .26em; }\n[data-skin=\"medieval\"] .bb-wordmark { font-weight: 400; letter-spacing: .01em; text-transform: none; }\n\n/* Riso: the plates do not line up. */\n[data-skin=\"riso\"] .bb-title {\n  text-shadow: 1.4px .5px 0 rgba(255, 72, 176, .92), -1.4px -.5px 0 rgba(31, 95, 208, .8);\n}\n[data-skin=\"riso\"][data-dark] .bb-title {\n  text-shadow: 1.4px .5px 0 rgba(255, 92, 187, .95), -1.4px -.5px 0 rgba(90, 150, 255, .85);\n}\n\n/* Medieval: rubricated initial. */\n[data-skin=\"medieval\"] .bb-rubric::first-letter {\n  font-family: var(--font-display);\n  font-size: 1.9em;\n  line-height: .8;\n  float: left;\n  margin: .06em .12em 0 0;\n  color: var(--rubric, #9c2b16);\n}\n\n/* Double rule, the way a ruled page divides. */\n[data-skin=\"medieval\"] .bb-ruled {\n  border-bottom: 1px solid var(--border-strong);\n  box-shadow: 0 3px 0 -2px var(--border-strong);\n}\n[data-skin=\"deco\"] .bb-ruled {\n  border-bottom: 1px solid var(--accent);\n  box-shadow: 0 3px 0 -2px var(--accent);\n}\n\n/* Deco: stepped corner brackets. */\n[data-skin=\"deco\"] .bb-framed { position: relative; }\n[data-skin=\"deco\"] .bb-framed::before,\n[data-skin=\"deco\"] .bb-framed::after {\n  content: \"\";\n  position: absolute;\n  width: 14px;\n  height: 14px;\n  border: 1px solid var(--accent);\n  pointer-events: none;\n}\n[data-skin=\"deco\"] .bb-framed::before { top: 4px; left: 4px; border-right: none; border-bottom: none; }\n[data-skin=\"deco\"] .bb-framed::after { right: 4px; bottom: 4px; border-left: none; border-top: none; }\n\n/* Dividers. */\n.bb-band { height: 5px; }\n[data-skin=\"default\"] .bb-band { display: none; }\n[data-skin=\"deco\"] .bb-band {\n  background-image:\n    linear-gradient(135deg, var(--accent) 25%, transparent 25%),\n    linear-gradient(225deg, var(--accent) 25%, transparent 25%);\n  background-size: 10px 10px;\n  opacity: .5;\n}\n[data-skin=\"riso\"] .bb-band {\n  background: repeating-linear-gradient(90deg,\n    var(--ink-pink) 0 14px, var(--ink-yellow) 14px 28px, var(--ink-blue) 28px 42px);\n}\n[data-skin=\"medieval\"] .bb-band {\n  background: repeating-linear-gradient(90deg, var(--gold) 0 2px, transparent 2px 7px);\n  height: 3px;\n  opacity: .8;\n}\n\n.bb-proper { text-transform: none !important; }\n\n/* ============================================================\n   Component layer — the repeated objects, so the surfaces stay\n   inline-styled for layout only.\n   ============================================================ */\n\n.bb-card {\n  background: var(--surface);\n  border: var(--card-border-width) solid var(--border-strong);\n  border-radius: var(--card-radius);\n  box-shadow: var(--shadow-sm);\n}\n\n.bb-btn {\n  font-family: var(--font-head);\n  font-weight: var(--head-weight);\n  font-size: 12px;\n  letter-spacing: var(--head-track);\n  text-transform: var(--head-case);\n  padding: 4px 10px;\n  border: 1px solid var(--border-strong);\n  border-radius: var(--btn-radius);\n  background: transparent;\n  color: var(--text);\n  cursor: pointer;\n  line-height: 1.5;\n}\n.bb-btn:hover { background: var(--accent-soft); }\n.bb-btn:active { background: var(--accent-soft-2); }\n.bb-btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }\n.bb-btn-primary:hover { background: var(--accent-hover); color: var(--on-accent); }\n.bb-btn-danger { color: var(--danger); border-color: var(--danger); }\n.bb-btn-plain { border-color: transparent; }\n\n.bb-row {\n  display: flex;\n  align-items: center;\n  width: 100%;\n  text-align: left;\n  background: transparent;\n  border: 0;\n  cursor: pointer;\n  color: inherit;\n  font: inherit;\n}\n.bb-row:hover { background: var(--accent-soft); }\n\n.bb-input {\n  font-family: var(--font);\n  font-size: 13px;\n  color: var(--text);\n  background: var(--surface-2);\n  border: 1px solid var(--border-strong);\n  border-radius: var(--r-sm);\n  padding: 4px 8px;\n}\n\n.bb-avatar {\n  display: grid;\n  place-items: center;\n  font-family: var(--font-head);\n  font-weight: 700;\n  border: 1px solid var(--border-strong);\n  border-radius: var(--r-sm);\n  color: var(--text);\n}\n\n\n*:focus-visible { outline: 2px solid var(--accent, #1d9bf0); outline-offset: 2px; }\n\n/* ---- the host page, which is X's own chrome and stays unskinned ---- */\n\n.x-page { background: #ffffff; color: #0f1419; }\n.x-page[data-xdark] { background: #000000; color: #e7e9ea; }\n.x-rule { border-color: #eff3f4; }\n.x-page[data-xdark] .x-rule { border-color: #2f3336; }\n.x-dim { color: #536471; }\n.x-page[data-xdark] .x-dim { color: #71767b; }\n.x-ghost { background: #eff3f4; }\n.x-page[data-xdark] .x-ghost { background: #202327; }\n.x-nav { color: inherit; }\n.x-nav:hover { background: rgba(15, 20, 25, .07); }\n.x-page[data-xdark] .x-nav:hover { background: rgba(255, 255, 255, .09); }\n.x-follow {\n  background: #0f1419; color: #ffffff; border: 0; border-radius: 999px;\n  padding: 7px 16px; font-size: 14px; font-weight: 700; cursor: pointer;\n}\n.x-page[data-xdark] .x-follow { background: #eff3f4; color: #0f1419; }\n\n/* The panel takes the gutter to the left of X's nav rather than\n   squeezing the timeline: it grows left, the column does not move. */\n.bb-gutter-out { width: 356px; margin-left: -56px; }\n\n@media (prefers-reduced-motion: reduce) {\n  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }\n}\n\n/* ---- the paper itself: a skin's texture, laid over a surface ---- */\n.bb-grain { position: relative; isolation: isolate; }\n.bb-grain > * { position: relative; z-index: 1; }\n.bb-grain::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  z-index: 0;\n  background-image: var(--tex);\n  background-size: var(--tex-size);\n  background-repeat: repeat;\n  mix-blend-mode: var(--tex-blend);\n  opacity: var(--tex-opacity);\n  border-radius: inherit;\n}\n\n.bb-tile {\n  display: block;\n  box-sizing: border-box;\n  width: 100%;\n  text-align: left;\n  cursor: pointer;\n  font-family: var(--font-head);\n  font-weight: var(--head-weight);\n  letter-spacing: var(--head-track);\n  text-transform: var(--head-case);\n  background: var(--surface);\n  color: var(--text-muted);\n  border: var(--card-border-width) solid var(--border);\n  border-radius: var(--card-radius);\n  box-shadow: var(--shadow-sm);\n  padding: 8px 9px;\n  font-size: 12px;\n  line-height: 1.2;\n  transition: transform .12s ease, box-shadow .12s ease;\n}\n.bb-tile:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); color: var(--text); }\n.bb-tile-on {\n  background: var(--accent);\n  color: var(--on-accent);\n  border-color: var(--accent);\n  box-shadow: var(--shadow-md);\n}\n.bb-tile-on:hover { color: var(--on-accent); }\n\n.bb-icon-btn {\n  display: grid;\n  place-items: center;\n  width: 26px;\n  height: 26px;\n  padding: 0;\n  cursor: pointer;\n  background: transparent;\n  border: 1px solid transparent;\n  border-radius: var(--r-sm);\n  color: var(--header-text);\n  opacity: .75;\n}\n.bb-icon-btn:hover { opacity: 1; background: rgba(127, 127, 127, .22); border-color: currentColor; }\n\n/* ---- the overlay's items: an opaque plate, or glass over live page ---- */\n.bb-plate {\n  box-sizing: border-box;\n  background: var(--surface);\n  border: var(--card-border-width) solid var(--border);\n  border-radius: var(--card-radius);\n  box-shadow: var(--shadow-md);\n}\n\n.bb-x {\n  display: grid;\n  place-items: center;\n  width: 24px;\n  height: 24px;\n  flex: 0 0 24px;\n  padding: 0;\n  cursor: pointer;\n  background: transparent;\n  color: currentColor;\n  border: 1px solid currentColor;\n  border-radius: var(--r-sm);\n  opacity: .7;\n  transition: opacity .12s ease, background .12s ease, transform .12s ease;\n}\n.bb-x:hover { opacity: 1; transform: rotate(90deg); }\n\n/* The ground the overlay floats on: the host column goes quiet behind it. */\n.bb-scrim {\n  position: absolute;\n  top: 0;\n  bottom: 0;\n  left: 0;\n  width: 292px;\n  z-index: 65;\n  pointer-events: none;\n  background: color-mix(in srgb, var(--bg) 86%, transparent);\n  backdrop-filter: blur(7px) saturate(.9);\n  -webkit-backdrop-filter: blur(7px) saturate(.9);\n}\n\n/* Icon-only actions: rename (pen), delete (trash), remove (cross). */\n.bb-icon-act {\n  display: grid;\n  place-items: center;\n  box-sizing: border-box;\n  width: 26px;\n  height: 26px;\n  flex: 0 0 26px;\n  padding: 0;\n  cursor: pointer;\n  background: transparent;\n  color: var(--text-muted);\n  border: 1px solid var(--border-strong);\n  border-radius: var(--r-sm);\n}\n.bb-icon-act:hover { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }\n.bb-icon-danger:hover { color: #fff; background: var(--danger); border-color: var(--danger); }\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #0b0d0f; }\n  a { color: var(--accent-ink, #b81808); }\n  a:hover { color: var(--accent-hover, #9c1206); }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: #0b0d0f; font-family: 'Space Grotesk', system-ui, sans-serif;\">\n\n  <div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #15181b; color: #8b949e; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; position: sticky; top: 0; z-index: 90;\">\n    <span style=\"color: #5e6671;\">Prototype<\u002Fspan>\n    <button type=\"button\" sc-camel-on-clic 24 24\" fill=\"currentColor\"><circle cx=\"9\" cy=\"6\" r=\"1.6\"><\u002Fcircle><circle cx=\"15\" cy=\"6\" r=\"1.6\"><\u002Fcircle><circle cx=\"9\" cy=\"12\" r=\"1.6\"><\u002Fcircle><circle cx=\"15\" cy=\"12\" r=\"1.6\"><\u002Fcircle><circle cx=\"9\" cy=\"18\" r=\"1.6\"><\u002Fcircle><circle cx=\"15\" cy=\"18\" r=\"1.6\"><\u002Fcircle><\u002Fsvg>\n                <\u002Fspan>\n                <sc-if value=\"{{ t.renaming }}\" hint-placeholder-val=\"{{ false }}\">\n                  <input class=\"bb-input\" value=\"{{ renameDraft }}\" sc-camel-on-change=\"{{ onRenameDraft }}\" style=\"font-size: 16px; flex: 0 1 260px; min-width: 0;\">\n                <\u002Fsc-if>\n                <sc-if value=\"{{ t.notRenaming }}\" hint-placeholder-val=\"{{ true }}\">\n                  <h3 class=\"bb-head bb-title\" style=\"margin: 0; font-size: 18px;\">{{ t.name }}<\u002Fh3>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ t.renaming }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button type=\"button\" class=\"bb-icon-act\" sc-camel-on-click=\"{{ t.commitRename }}\" title=\"Save name\">\n                    <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ t.notRenaming }}\" hint-placeholder-val=\"{{ true }}\">\n                  <button type=\"button\" class=\"bb-icon-act\" sc-camel-on-click=\"{{ t.startRename }}\" title=\"Rename topic\">\n                    <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9\"><\u002Fpath><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fsc-if>\n                <span style=\"font-size: 11px; color: var(--text-faint);\">{{ t.tally }}<\u002Fspan>\n                <button type=\"button\" class=\"bb-icon-act bb-icon-danger\" sc-camel-on-click=\"{{ t.askDelete }}\" title=\"Delete topic\" style=\"margin-left: auto;\">\n                  <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h16\"><\u002Fpath><path d=\"M9 7V5h6v2\"><\u002Fpath><path d=\"M6 7v13h12V7\"><\u002Fpath><path d=\"M10 11v5\"><\u002Fpath><path d=\"M14 11v5\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ t.confirming }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display: flex; align-items: center; gap: 10px; margin-top: 11px; padding: 9px 11px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--r-sm);\">\n                  <span style=\"font-size: 13px;\">{{ t.confirmLine }}<\u002Fspan>\n                  <span style=\"margin-left: auto; display: flex; gap: 6px;\">\n                    <button type=\"button\" class=\"bb-btn bb-btn-plain\" sc-camel-on-click=\"{{ t.cancelDelete }}\">Cancel<\u002Fbutton>\n                    <button type=\"button\" class=\"bb-btn bb-btn-primary\" sc-camel-on-click=\"{{ t.confirmDelete }}\">Delete it all<\u002Fbutton>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"display: flex; flex-direction: column; gap: 3px; margin-top: 11px;\">\n                <sc-for list=\"{{ t.rows }}\" as=\"r\" hint-placeholder-count=\"2\">\n                  <div style=\"display: flex; align-items: center; gap: 11px; padding: 7px 8px; background: var(--surface-2); border-radius: var(--r-sm);\">\n                    <span class=\"bb-avatar\" style=\"flex: 0 0 30px; width: 30px; height: 30px; font-size: 12px; background: {{ r.tint }};\">{{ r.mono }}<\u002Fspan>\n                    <span style=\"min-width: 0; flex: 0 0 168px;\">\n                      <span style=\"display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ r.name }}<\u002Fspan>\n                      <span style=\"display: block; font-size: 11px; color: var(--text-faint);\">{{ r.handle }}<\u002Fspan>\n                    <\u002Fspan>\n                    <sc-if value=\"{{ r.editing }}\" hint-placeholder-val=\"{{ false }}\">\n                      <input class=\"bb-input\" value=\"{{ noteDraft }}\" sc-camel-on-change=\"{{ onNoteDraft }}\" sc-camel-on-blur=\"{{ r.commitNote }}\" placeholder=\"3–5 words\" style=\"flex: 1; min-width: 0;\">\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ r.notEditing }}\" hint-placeholder-val=\"{{ true }}\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ r.editNote }}\" title=\"Click to edit\" class=\"bb-row\" style=\"flex: 1; min-width: 0; padding: 3px 6px; border-radius: var(--r-sm); font-size: 13px; color: var(--accent-ink);\">{{ r.note }}<\u002Fbutton>\n                    <\u002Fsc-if>\n                    <button type=\"button\" class=\"bb-icon-act bb-icon-danger\" sc-camel-on-click=\"{{ r.remove }}\" title=\"Remove from topic\">\n                      <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 6l12 12\"><\u002Fpath><path d=\"M18 6 6 18\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n\n                <sc-for list=\"{{ t.posts }}\" as=\"p\" hint-placeholder-count=\"2\">\n                  <div style=\"display: flex; align-items: flex-start; gap: 11px; padding: 8px 10px; background: var(--surface-2); border-radius: var(--r-sm);\">\n                    <span class=\"bb-head\" style=\"flex: 0 0 96px; font-size: 11px; color: var(--accent-ink);\">{{ p.handle }}<\u002Fspan>\n                    <p style=\"margin: 0; flex: 1; min-width: 0; font-size: 13px; line-height: 1.4; color: var(--text-muted);\">{{ p.text }}<\u002Fp>\n                    <span style=\"font-size: 11px; color: var(--text-faint);\">{{ p.when }}<\u002Fspan>\n                    <button type=\"button\" class=\"bb-icon-act bb-icon-danger\" sc-camel-on-click=\"{{ p.remove }}\" title=\"Remove from pouch\">\n                      <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 6l12 12\"><\u002Fpath><path d=\"M18 6 6 18\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n\n                <sc-if value=\"{{ t.empty }}\" hint-placeholder-val=\"{{ false }}\">\n                  <p style=\"margin: 2px 0 0; font-size: 12px; color: var(--text-faint);\">Nothing filed here yet.<\u002Fp>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;skin&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;riso&quot;,&quot;medieval&quot;,&quot;deco&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Skin&quot;}}\">\n/* Pouch — a Bell Bearer site module for x.com.\n *\n * Two surfaces in one component:\n *   surface \"x\"    the content-script UI injected into x.com — the overlay\n *                  panel, the bag button that replaces X's bookmark, and the\n *                  add-to-pouch button on a profile.\n *   surface \"dash\" the dashboard's X view — the only place topics are made,\n *                  renamed, reordered, deleted, and notes edited.\n *\n * Storage shape the extension should persist (chrome.storage.local):\n *   peopleTopics []  {id, name}     order is the display order\n *   postTopics   []  {id, name}     independent of peopleTopics\n *   people       []  {id, topic, name, handle, note}   exactly one topic each\n *   saved        []  {id, topic, handle, when, text}   exactly one topic each\n */\nconst TINTS = [\"var(--site-tint-1)\", \"var(--site-tint-2)\", \"var(--site-tint-3)\", \"var(--site-tint-4)\"];\n\nclass Component extends DCLogic {\n  state = {\n    surface: \"x\",\n    skin: \"default\",\n    xDark: false,\n    dashDark: false,\n    panelOpen: false,\n    side: \"people\",\n    openTopic: null,\n    route: \"timeline\",\n    profileId: null,\n    picker: null,\n    profilePicker: false,\n    newTopicOpen: false,\n    newTopicName: \"\",\n    dashTab: \"people\",\n    editingNote: null,\n    noteDraft: \"\",\n    renaming: null,\n    renameDraft: \"\",\n    confirming: null,\n    dragId: null,\n\n    peopleTopics: [\n      { id: \"ml\", name: \"ML\" },\n      { id: \"cuda\", name: \"CUDA\" },\n      { id: \"diffusion\", name: \"Diffusion\" },\n      { id: \"kernels\", name: \"Kernels & Triton\" },\n      { id: \"hardware\", name: \"Hardware\" },\n      { id: \"serving\", name: \"Inference & serving\" },\n      { id: \"training\", name: \"Training infra\" }\n    ],\n    postTopics: [\n      { id: \"pml\", name: \"ML\" },\n      { id: \"pcuda\", name: \"CUDA\" },\n      { id: \"ppapers\", name: \"Papers\" },\n      { id: \"pkernels\", name: \"Kernels & Triton\" },\n      { id: \"pbench\", name: \"Benchmarks\" },\n      { id: \"plater\", name: \"Read later\" }\n    ],\n    people: [\n      { id: 1, topic: \"ml\", name: \"Wei Tan\", handle: \"@weitan\", note: \"distills papers daily\" },\n      { id: 2, topic: \"ml\", name: \"Lena Fischer\", handle: \"@lenaf\", note: \"evals, skeptical takes\" },\n      { id: 3, topic: \"cuda\", name: \"Ilya Sorokin\", handle: \"@isorokin\", note: \"warp-level tricks\" },\n      { id: 4, topic: \"cuda\", name: \"Grace Mutua\", handle: \"@gmutua\", note: \"profiler deep dives\" },\n      { id: 5, topic: \"diffusion\", name: \"Chiara Rossi\", handle: \"@chiarar\", note: \"posts code with papers\" },\n      { id: 6, topic: \"diffusion\", name: \"Omar Said\", handle: \"@omarsaid\", note: \"sampler comparisons\" },\n      { id: 7, topic: \"kernels\", name: \"Tomas Brandt\", handle: \"@tbrandt\", note: \"triton kernels, patient\" },\n      { id: 8, topic: \"kernels\", name: \"Nusrat Jahan\", handle: \"@nusratj\", note: \"fused attention writeups\" },\n      { id: 10, topic: \"hardware\", name: \"Kenji Mori\", handle: \"@kmori\", note: \"interconnect numbers\" },\n      { id: 11, topic: \"serving\", name: \"Rafi Hasan\", handle: \"@rafihasan\", note: \"batching economics\" },\n      { id: 12, topic: \"training\", name: \"Adaeze Nwosu\", handle: \"@adaeze\", note: \"fault-tolerant runs\" }\n    ],\n    saved: [\n      { id: 101, topic: \"pml\", handle: \"@lenaf\", when: \"6h\", text: \"Benchmark contamination check before the leaderboard screenshot, please.\" },\n      { id: 102, topic: \"pcuda\", handle: \"@isorokin\", when: \"2d\", text: \"Occupancy is not throughput. The kernel at 40% occupancy was the faster one.\" },\n      { id: 103, topic: \"ppapers\", handle: \"@nokafor\", when: \"1w\", text: \"Table 4 is the paper. The abstract is marketing.\" },\n      { id: 104, topic: \"pkernels\", handle: \"@tbrandt\", when: \"4d\", text: \"Fused the epilogue and lost the register spill. 1.7x.\" },\n      { id: 105, topic: \"pbench\", handle: \"@kmori\", when: \"3d\", text: \"Interconnect, not FLOPs, set the wall on this run.\" }\n    ],\n    // Stand-in for X's own timeline; in the extension these are read off the DOM.\n    timeline: [\n      { id: \"p1\", name: \"Ilya Sorokin\", handle: \"@isorokin\", mono: \"IS\", when: \"12m\", replies: 14, reposts: 31, likes: 212, topic: \"pcuda\",\n        text: \"Spent the morning convinced the kernel was memory bound. It was the launch configuration.\",\n        bio: \"Kernels, profilers and the occasional rant about occupancy.\" },\n      { id: \"p2\", name: \"Chiara Rossi\", handle: \"@chiarar\", mono: \"CR\", when: \"1h\", replies: 8, reposts: 54, likes: 480, topic: null,\n        text: \"Posting the sampler comparison as a notebook rather than a thread. Charts lie faster than code does.\",\n        bio: \"Diffusion models. Code with every claim.\" },\n      { id: \"p3\", name: \"Wei Tan\", handle: \"@weitan\", mono: \"WT\", when: \"3h\", replies: 22, reposts: 9, likes: 96, topic: null,\n        text: \"Short read of the routing ablation: the interesting number is in table 4, not the abstract.\",\n        bio: \"Reading papers so you can skim them.\" }\n    ]\n  };\n\n  componentDidMount() {\n    if (this.props.skin && this.props.skin !== this.state.skin) this.setState({ skin: this.props.skin });\n  }\n\n  mono(name) { return name.split(\" \").map(w => w[0]).join(\"\").slice(0, 2).toUpperCase(); }\n  topics(side) { return side === \"people\" ? this.state.peopleTopics : this.state.postTopics; }\n  topicName(side, id) { const t = this.topics(side).find(x => x.id === id); return t ? t.name : \"\"; }\n  peopleIn(id) { return this.state.people.filter(p => p.topic === id); }\n  postsIn(id) {\n    const seeded = this.state.saved.filter(p => p.topic === id);\n    const live = this.state.timeline.filter(p => p.topic === id)\n      .map(p => ({ id: p.id, topic: id, handle: p.handle, when: p.when, text: p.text }));\n    return seeded.concat(live.filter(l => !seeded.some(x => x.handle === l.handle && x.text === l.text)));\n  }\n\n  renderVals() {\n    const s = this.state;\n    const onX = s.surface === \"x\";\n    const sideTopics = this.topics(s.side);\n    const open = s.openTopic ? sideTopics.find(t => t.id === s.openTopic) : null;\n    const openPeople = open && s.side === \"people\" ? this.peopleIn(open.id) : [];\n    const openPosts = open && s.side === \"posts\" ? this.postsIn(open.id) : [];\n    const tabOn = \"bb-btn bb-btn-primary\";\n    const tabOff = \"bb-btn\";\n    const profilePerson = s.profileId ? s.timeline.find(p => p.id === s.profileId) || s.people.find(p => p.id === s.profileId) : null;\n    const savedProfile = profilePerson ? s.people.find(p => p.handle === profilePerson.handle) : null;\n\n    return {\n      onX, onDash: !onX,\n      skin: s.skin,\n      xDarkAttr: s.xDark ? \"1\" : undefined,\n      dashDarkAttr: s.dashDark ? \"1\" : undefined,\n      hint: onX ? \"Click Pouch in the nav\" : \"Skins, topics and notes are managed here\",\n      dashHint: \"People and posts keep separate topic lists. Removing a saved post happens here.\",\n      tabXClass: onX ? \"bb-btn-primary\" : \"\",\n      tabDashClass: onX ? \"\" : \"bb-btn-primary\",\n      showX: () => this.setState({ surface: \"x\" }),\n      showDash: () => this.setState({ surface: \"dash\", panelOpen: false, picker: null, profilePicker: false }),\n\n      panelOpen: s.panelOpen,\n      pouchStroke: s.panelOpen ? \"var(--accent)\" : \"currentColor\",\n      togglePanel: () => this.setState(x => ({ panelOpen: !x.panelOpen, openTopic: null, picker: null })),\n      // Anything outside a [data-keep-panel] subtree dismisses the overlay.\n      pageClick: e => {\n        const keep = e.target.closest && e.target.closest(\"[data-keep-panel]\");\n        if (keep) return;\n        if (s.panelOpen || s.picker || s.profilePicker) {\n          this.setState({ panelOpen: false, openTopic: null, picker: null, profilePicker: false });\n        }\n      },\n\n      peopleTabCls: s.side === \"people\" ? tabOn : tabOff,\n      postsTabCls: s.side === \"posts\" ? tabOn : tabOff,\n      showPeople: () => this.setState({ side: \"people\", openTopic: null }),\n      showPosts: () => this.setState({ side: \"posts\", openTopic: null }),\n\n      topicsView: !open,\n      topicOpen: !!open,\n      openName: open ? open.name : \"\",\n      backToTopics: () => this.setState({ openTopic: null }),\n      topicList: sideTopics.map(t => ({ name: t.name, open: () => this.setState({ openTopic: t.id }) })),\n\n      onPeopleTab: !!open && s.side === \"people\" && openPeople.length > 0,\n      onPostsTab: !!open && s.side === \"posts\" && openPosts.length > 0,\n      topicEmpty: !!open && (s.side === \"people\" ? openPeople.length : openPosts.length) === 0,\n      people: openPeople.map((p, i) => ({\n        mono: this.mono(p.name), name: p.name, note: p.note, tint: TINTS[i % 4],\n        open: () => this.setState({ route: \"profile\", profileId: p.id, panelOpen: false, openTopic: null })\n      })),\n      savedPosts: openPosts.map(p => ({ handle: p.handle, when: p.when, text: p.text })),\n\n      onTimeline: onX && s.route === \"timeline\",\n      onProfile: onX && s.route === \"profile\",\n      goTimeline: () => this.setState({ route: \"timeline\", panelOpen: false, openTopic: null, picker: null, profilePicker: false }),\n\n      newTopicOpen: s.newTopicOpen,\n      newTopicClosed: !s.newTopicOpen,\n      newTopicName: s.newTopicName,\n      onNewTopicName: e => this.setState({ newTopicName: e.target.value }),\n      openNewTopic: () => this.setState({ newTopicOpen: true }),\n      commitNewPostTopic: () => this.setState(x => {\n        const name = x.newTopicName.trim();\n        if (!name) return { newTopicOpen: false };\n        return { postTopics: x.postTopics.concat([{ id: \"pt\" + Date.now(), name }]), newTopicOpen: false, newTopicName: \"\" };\n      }),\n\n      timeline: s.timeline.map(p => ({\n        ...p,\n        bagLabel: p.topic ? this.topicName(\"posts\", p.topic) : \"Pouch\",\n        bagFill: p.topic ? \"var(--accent)\" : \"transparent\",\n        bagColor: p.topic ? \"var(--on-accent)\" : \"currentColor\",\n        bagBorder: p.topic ? \"var(--accent)\" : \"currentColor\",\n        pickerOpen: s.picker === p.id,\n        togglePicker: () => this.setState(x => ({ picker: x.picker === p.id ? null : p.id, newTopicOpen: false })),\n        // The picker only re-files. Un-saving is a dashboard action.\n        options: s.postTopics.map(t => ({\n          name: t.name,\n          dot: p.topic === t.id ? \"var(--accent)\" : \"transparent\",\n          pick: () => this.setState(x => ({\n            picker: null,\n            timeline: x.timeline.map(o => o.id !== p.id ? o : ({ ...o, topic: t.id })),\n            saved: x.saved.filter(o => !(o.handle === p.handle && o.text === p.text))\n          }))\n        }))\n      })),\n\n      profileName: profilePerson ? profilePerson.name : \"\",\n      profileHandle: profilePerson ? profilePerson.handle : \"\",\n      profileMono: profilePerson ? this.mono(profilePerson.name) : \"\",\n      profileBio: profilePerson ? (profilePerson.bio || \"Filed in your pouch.\") : \"\",\n      profileSaved: !!savedProfile,\n      profileTopic: savedProfile ? this.topicName(\"people\", savedProfile.topic) : \"\",\n      profileNote: savedProfile ? savedProfile.note : \"\",\n      profileBagLabel: savedProfile ? this.topicName(\"people\", savedProfile.topic) : \"Add to pouch\",\n      profileBagFill: savedProfile ? \"var(--accent)\" : \"transparent\",\n      profileBagColor: savedProfile ? \"var(--on-accent)\" : \"var(--accent-ink)\",\n      profilePickerOpen: s.profilePicker,\n      toggleProfilePicker: () => this.setState(x => ({ profilePicker: !x.profilePicker })),\n      profileOptions: s.peopleTopics.map(t => ({\n        name: t.name,\n        dot: savedProfile && savedProfile.topic === t.id ? \"var(--accent)\" : \"transparent\",\n        pick: () => {\n          if (!profilePerson) return;\n          this.setState(x => {\n            const existing = x.people.find(p => p.handle === profilePerson.handle);\n            if (existing) {\n              return { profilePicker: false, people: x.people.map(p => p.handle !== profilePerson.handle ?
