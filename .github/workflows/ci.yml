name: CI

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run pure-logic and load-order checks
        run: node tests/node-check.js
