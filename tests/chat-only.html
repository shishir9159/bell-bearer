<!doctype html>
<meta charset="utf-8">
<title>bell-bearer — chat specs only</title>
<style>
    body { font: 13px/1.5 Consolas, ui-monospace, monospace; background: #1b1b1b; color: #ddd; margin: 0; padding: 24px; }
    h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
    .sub { color: #888; margin-bottom: 16px; }
    #out { white-space: pre; padding: 16px; border-radius: 6px; background: #141414; border: 1px solid #333; overflow-x: auto; }
    #banner { margin-top: 14px; padding: 10px 14px; border-radius: 6px; font-weight: 600; }
    .ok { background: #16341f; color: #7ee2a0; }
    .bad { background: #3a1717; color: #ff9b9b; }
</style>

<h1>chat specs</h1>
<div class="sub">
    The chat specs index.html runs, with only the modules they touch — the
    x-only.html arrangement, for the same reason: the full suite spends
    minutes in sections whose timers a hidden tab throttles. Run
    tests/index.html before committing.
</div>
<pre id="out">running…</pre>
<div id="banner"></div>

<script src="harness.js"></script>
<script src="mock-chrome.js"></script>

<script src="../src/shared/time.js"></script>
<script src="../src/shared/dom.js"></script>
<script src="../src/shared/icons.js"></script>
<script src="../src/shared/selectors.js"></script>
<script src="../src/shared/ids.js"></script>
<script src="../src/shared/settings.js"></script>
<script src="../src/shared/store.js"></script>
<script src="../src/shared/keybindings.js"></script>
<script src="../src/content/overlay.js"></script>
<script src="../src/content/theme.js"></script>
<script src="../src/content/shortcuts.js"></script>
<script src="../src/content/scroll-to.js"></script>
<script src="../src/content/composer.js"></script>

<!-- In manifest order, as index.html has them. -->
<script src="../src/shared/chat-sites.js"></script>
<script src="../src/shared/chat-tree.js"></script>
<script src="../src/shared/chatgpt-format.js"></script>
<script src="../src/shared/claude-format.js"></script>
<script src="../src/shared/chat-diff.js"></script>
<script src="../src/shared/chat-export.js"></script>
<script src="../src/shared/zip.js"></script>

<script src="../src/content/chat-dom.js"></script>
<script src="../src/content/bridge.js"></script>
<script src="../src/content/chatgpt-read.js"></script>
<script src="../src/content/claude-read.js"></script>
<script src="../src/content/chat-nav.js"></script>
<script src="../src/content/chat-tree-view.js"></script>
<script src="../src/content/chat-compare.js"></script>
<script src="../src/content/chat-panel.js"></script>
<script src="../src/content/chat-library.js"></script>
<script src="../src/content/chat-picker.js"></script>
<script src="../src/content/chat-runner.js"></script>
<script src="../src/content/chat-queue-view.js"></script>
<script src="../src/content/chat-ui.js"></script>

<script src="chat-stage.js"></script>
<script src="chat.test.js"></script>
<script src="chat-queue.test.js"></script>
<script src="chat-claude.test.js"></script>

<script>
    (async () => {
        const out = document.getElementById('out');
        const banner = document.getElementById('banner');
        try {
            const r = await runAllTests(out);
            banner.className = r.failed ? 'bad' : 'ok';
            banner.textContent = r.failed ? `${r.failed} test(s) failing` : `all ${r.passed} tests passing`;
        } catch (e) {
            out.textContent = 'HARNESS ERROR\n\n' + (e && e.stack ? e.stack : e);
            banner.className = 'bad';
            banner.textContent = 'suite crashed';
        }
    })();
</script>
