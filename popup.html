<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bell Bearer</title>
    <link rel="stylesheet" href="skin-fonts.css">
    <link rel="stylesheet" href="skins.css">
    <link rel="stylesheet" href="popup.css">

    <!-- The popup asks the browser for its own width, so this pair has to run
         before the body is parsed rather than with the scripts at the foot. -->
    <script src="src/shared/settings.js"></script>
    <script src="src/page/popup-width.js"></script>
</head>

<body data-skin="default">
    <div class="container">
        <header class="bb-ruled">
            <div class="brand">
                <h1 class="bb-wordmark"><img class="brand-icon" src="icons/icon128.png" alt="">Bell Bearer</h1>
                <span class="brand-count" id="brandCount"></span>
            </div>
            <div class="controls">
                <button id="dashboardBtn" class="btn-secondary is-primary" title="Open Dashboard">Dashboard</button>
            </div>
        </header>

        <div id="speedControlBar" class="speed-control-bar" hidden>
            <span class="speed-label">Playback</span>
            <div class="speed-buttons">
                <button id="speedDownBtn" class="btn-speed" title="Slower (previous step)" aria-label="Slower">−</button>
                <span id="speedDisplay" class="speed-display" aria-live="polite">1x</span>
                <button id="speedUpBtn" class="btn-speed" title="Faster (next step)" aria-label="Faster">+</button>
                <button id="speedResetBtn" class="btn-speed btn-speed-reset" title="Reset to 1x" aria-label="Reset speed">1x</button>
            </div>
        </div>

        <!-- Checkpoints are a YouTube feature end to end (the store, the
             shortcut, the transcript they attach to) — shown only when the
             active tab is on YouTube. See popup.js#applySiteLayout. -->
        <div id="youtubePanel" hidden>
            <div class="main-content" id="mainContent">
                <div class="video-list" id="videoList"></div>

                <div class="bookmark-details" id="bookmarkDetails">
                    <div class="no-selection">
                        <div class="empty-icon">⏱</div>
                        <p>Select a video to see its checkpoints</p>
                    </div>
                </div>
            </div>

            <div class="instructions" id="instructions">
                <h3>How to use</h3>
                <ul>
                    <li>Hold <strong>Ctrl + B</strong> while watching to drop a checkpoint. <strong>&gt;</strong> <strong>&lt;</strong> step speed, <strong>+</strong> resets.</li>
                </ul>
                <div class="instructions-footer">
                    <button id="dismissInstructions" class="btn-okay">Okay</button>
                </div>
            </div>
        </div>

        <!-- Everywhere else: nothing here belongs to this site, so the popup
             says so and points at the one thing that is never site-specific.
             The speed bar above still applies on its own — any page with an
             HTML5 <video> gets it, this site included. -->
        <div class="generic-panel" id="genericPanel" hidden>
            <div class="generic-panel-body">
                <div class="generic-icon">🔖</div>
                <p class="generic-title">Checkpoints are a YouTube thing</p>
                <p class="generic-hint">Open a YouTube video to drop one. Your saved checkpoints and topics live in the dashboard.</p>
                <button id="genericDashboardBtn" class="btn-generic-dashboard">Open Dashboard</button>
            </div>
        </div>
    </div>


    <!-- Shared modules, in dependency order. Classic scripts sharing a `BB`
         namespace: the extension has no build step by design. -->
    <script src="src/shared/time.js"></script>
    <script src="src/shared/dom.js"></script>
    <script src="src/shared/speed.js"></script>
    <script src="src/shared/skin.js"></script>
    <script src="src/shared/youtube.js"></script>
    <script src="src/shared/bookmarks.js"></script>
    <script src="src/content/site.js"></script>
    <script src="src/page/ui.js"></script>
    <script src="src/page/tab-actions.js"></script>
    <script src="popup.js"></script>
</body>

</html>
